name: release

# On a vX.Y.Z tag: build + verify the sdist/wheel, publish a Forgejo release with the
# CHANGELOG section as notes and SHA256SUMS, and (only if the PYPI_API_TOKEN secret is
# set) upload to PyPI. Plain shell + the Forgejo API; no GitHub-only actions.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    # colo-only lane (rw-man-01, ctg-infrastructure ci-runners/rw-man-colo): security-tool CI never
    # runs on the EC2 hosts rw-man-02..05 (GuardDuty). Light slots, so pushes don't queue behind mutation.
    runs-on: colo-light-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, verify and publish the release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: python3 ci/release.py
