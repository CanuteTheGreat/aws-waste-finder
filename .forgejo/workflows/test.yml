name: tests

# Runs the whole test suite (every documented CLI option and check) on every
# push and PR, on the oldest Python the README promises and on current Python.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Concurrency (2026-10-17, ctg-infrastructure ollivanders/forgejo/ci-supersede-sweeper):
# other branches and PRs: a new push cancels the older run. main: runs queue behind each
# other instead, so a run that has started is never cancelled by a later push, and the
# sweeper cancels superseded runs that never started (keeps the newest, plus the oldest
# while nothing in the group runs, so constant pushes can't keep main at the back of
# the shared runner queue). Forgejo 17 ignores jobs.<id>.concurrency; only this block counts.
concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # colo-only lane (rw-man-01, ctg-infrastructure ci-runners/rw-man-colo): security-tool CI never
    # runs on the EC2 hosts rw-man-02..05 (GuardDuty). Light slots, so pushes don't queue behind mutation.
    runs-on: colo-light-x86_64
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (python ${{ matrix.python }}, capped container)
        run: sh ci/run-tests.sh "${{ matrix.python }}"
