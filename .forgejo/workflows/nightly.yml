name: nightly

# The slow test layers, nightly (and on demand), so per-push CI stays fast:
#  * mutation: mutmut over the whole tool every Sunday (fails below ci/mutation-min-score, only ever
#    raised); the other nights only the functions changed since the last green run (fails on any new
#    surviving mutant there)
#  * python-matrix: the full suite on every Python version from the README's minimum to the newest
#  * install-channels: pipx from the Forgejo URL (main and the latest tag), the latest release's
#    assets against SHA256SUMS, and the errant.solutions single-file download, as a user does
on:
  schedule:
    # staggered across the colo lane's day (ctg-infrastructure ci-runners/rw-man-colo/README.md)
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'mutation: auto (full on Sundays, else changed code only), full or incremental'
        required: false
        default: 'auto'

# A newer queued run replaces an older one that has not started (ci-supersede-sweeper,
# replace: groups); a started run is never cancelled.
concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # The mutant list is split in three parts run by three sequential jobs (ci/mutation.sh MUT_PART): Forgejo
  # ends any task after ~3 h and the whole 426-mutant run takes longer than that on a busy shared host
  # (run 79: killed at 200 min, exit 137). Same mutants, same floor, same gate: the last part applies them to
  # the results of all parts.
  mutation-part1:
    runs-on: mutation-any
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          # part 1 never records a baseline; its own key keeps the final job's key free to save
          key: mutation-baseline-part1-aws-waste-finder-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-aws-waste-finder-
      - name: Full or incremental?
        # full every Sunday (UTC) and on demand; other nights only the functions changed since the
        # last green run (ctg-infrastructure ci-runners/mutation-incremental)
        run: python3 ci/mutation-incremental.py plan --id aws-waste-finder --kind mutmut --full-dow 7 --mode "${{ github.event.inputs.mode }}" -- aws_waste_finder.py tests pyproject.toml ci/setup.sh
      - name: Mutation testing, part 1 of 3 (mutmut, capped container)
        if: env.MUT_MODE != 'skip'
        run: MUT_PART=1/3 sh ci/mutation.sh 3.13
      - name: Hand the part-1 results on
        if: env.MUT_MODE != 'skip'
        uses: actions/upload-artifact@v3
        with:
          name: mutation-part1
          path: .mutation-part/meta.tar
          retention-days: 2
          if-no-files-found: error

  mutation-part2:
    needs: mutation-part1
    runs-on: mutation-any
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          key: mutation-baseline-part2-aws-waste-finder-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-aws-waste-finder-
      - name: Full or incremental?
        run: python3 ci/mutation-incremental.py plan --id aws-waste-finder --kind mutmut --full-dow 7 --mode "${{ github.event.inputs.mode }}" -- aws_waste_finder.py tests pyproject.toml ci/setup.sh
      - name: Part-1 results
        if: env.MUT_MODE != 'skip'
        uses: actions/download-artifact@v3
        with:
          name: mutation-part1
          path: .mutation-part
      - name: Mutation testing, part 2 of 3 (mutmut, capped container)
        if: env.MUT_MODE != 'skip'
        run: MUT_PART=2/3 sh ci/mutation.sh 3.13
      - name: Hand the part-1+2 results on
        if: env.MUT_MODE != 'skip'
        uses: actions/upload-artifact@v3
        with:
          name: mutation-part2
          path: .mutation-part/meta.tar
          retention-days: 2
          if-no-files-found: error

  mutation:
    needs: mutation-part2
    # shared mutation/chaos lane (arch-independent, so x86 and arm64 slots on rw-man-01..05 since 2026-10-18,
    # ctg-infrastructure ci-runners/README.md); jobs that must stay on colo set CI_COLO_ONLY=1.
    runs-on: mutation-any
    timeout-minutes: 170  # a third of the mutants (parts 1 and 2 run the rest)
    steps:
      - uses: actions/checkout@v4
        with:
          # the incremental diff starts at the last green run's commit
          fetch-depth: 0
      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          # saved only when the job succeeds; restore-keys picks the newest green baseline
          key: mutation-baseline-aws-waste-finder-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-aws-waste-finder-
      - name: Full or incremental?
        # full every Sunday (UTC) and on demand; other nights only the functions changed since the
        # last green run (ctg-infrastructure ci-runners/mutation-incremental)
        run: python3 ci/mutation-incremental.py plan --id aws-waste-finder --kind mutmut --full-dow 7 --mode "${{ github.event.inputs.mode }}" -- aws_waste_finder.py tests pyproject.toml ci/setup.sh
      - name: Part-1+2 results
        if: env.MUT_MODE != 'skip'
        uses: actions/download-artifact@v3
        with:
          name: mutation-part2
          path: .mutation-part
      - name: Mutation testing, part 3 of 3 and the floor / new-survivor gate (mutmut, capped container)
        if: env.MUT_MODE != 'skip'
        run: MUT_PART=3/3 sh ci/mutation.sh 3.13

  python-matrix:
    # colo-light: a short test run in ci/run-tests.sh's own 1g container, like test.yml; colo-x86_64's
    # two slots are for mutation, where these 1-minute jobs used to queue for hours.
    # colo-only lane (rw-man-01, ctg-infrastructure ci-runners/rw-man-colo): mutation / chaos /
    # security-tool / network-probing CI never runs on the EC2 hosts rw-man-02..05 (GuardDuty).
    runs-on: colo-light-x86_64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (python ${{ matrix.python }}, capped container)
        run: sh ci/run-tests.sh "${{ matrix.python }}"

  install-channels:
    # colo-only lane (rw-man-01, ctg-infrastructure ci-runners/rw-man-colo): mutation / chaos /
    # security-tool / network-probing CI never runs on the EC2 hosts rw-man-02..05 (GuardDuty).
    runs-on: colo-light-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install from every documented channel and run it
        run: sh ci/install-channels.sh 3.13

  pip-audit:
    # new advisories appear without any push: re-audit every night (blocking, like test.yml's audit job)
    runs-on: colo-light-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: pip-audit (capped container)
        run: sh ci/pip-audit.sh 3.13
